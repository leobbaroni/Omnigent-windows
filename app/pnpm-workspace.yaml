packages:
  - "."

# pnpm 10+ refuses to run dependency build scripts unless allow-listed.
# electron's postinstall downloads the Chromium binary; electron-winstaller
# (pulled in by electron-builder) ships a native helper.
allowBuilds:
  electron: true
  electron-winstaller: true

# `pnpm run` otherwise re-runs `pnpm install` through a `pnpm` shim that only
# exists via corepack (`corepack pnpm …`), which fails on PATH-less shells/CI.
verifyDepsBeforeRun: false
